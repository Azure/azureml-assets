type: "evaluator"
id: "azureml://registries/azureml/evaluators/builtin.output_quality/versions/1"
name: "builtin.output_quality"
version: 6
displayName: "Output Quality Evaluator"
description: "A composite evaluator that batches fluency, coherence, intent_resolution, task_adherence, groundedness, and task_completion into a single LLM call."
evaluatorType: "builtin"
evaluatorSubType: "code"
categories: ["quality", "agents"]
supportedEvaluationLevels: ["conversation", "turn"]
tags:
  provider: "Microsoft"
  recommended: "true"
  is_continuous_scenario: "true"
  composite_evaluator: "fluency, coherence, intent_resolution, task_adherence, groundedness, task_completion"
initParameterSchema:
  type: "object"
  description: "Hosted initialization uses a named deployment resolved by the service. Python model_config and credentials remain internal constructor inputs, not public initialization parameters."
  properties:
    deployment_name:
      type: "string"
    threshold:
      type: "object"
      additionalProperties: false
      description: "Optional per-member public score thresholds; omitted members retain their defaults. Independent of the Decision binary probability cutoff."
      properties:
        fluency:
          type: "number"
          minimum: 1
          maximum: 5
        coherence:
          type: "number"
          minimum: 1
          maximum: 5
        intent_resolution:
          type: "number"
          minimum: 1
          maximum: 5
        task_adherence:
          type: "number"
          minimum: 0
          maximum: 1
        groundedness:
          type: "number"
          minimum: 1
          maximum: 5
        task_completion:
          type: "number"
          minimum: 0
          maximum: 1
    evaluation_level:
      type: "string"
    probability_threshold:
      type: "number"
      minimum: 0
      maximum: 1
      description: "Decision-only probability cutoff for task_adherence and task_completion, checked after trusted named-deployment resolution. Overrides the resolved configuration cutoff; defaults to 0.75. Public score thresholds are unchanged."
  required: ["deployment_name"]
  not:
    required: ["model_config"]
dataMappingSchema:
  type: "object"
  properties:
    query:
      anyOf:
        - type: "string"
        - type: "array"
          items:
            type: "object"
    response:
      anyOf:
        - type: "string"
        - type: "array"
          items:
            type: "object"
    tool_definitions:
      anyOf:
        - type: "object"
        - type: "array"
          items:
            type: "object"
    messages:
      type: "array"
      minItems: 1
      items:
        type: "object"
  anyOf:
    - required: ["response"]
    - required: ["messages"]
outputSchema:
  output_quality:
    type: "boolean"
    desirable_direction: "increase"
    min_value: 0
    max_value: 1
    is_primary: true
  fluency:
    type: "ordinal"
    desirable_direction: "increase"
    min_value: 1
    max_value: 5
  coherence:
    type: "ordinal"
    desirable_direction: "increase"
    min_value: 1
    max_value: 5
  intent_resolution:
    type: "ordinal"
    desirable_direction: "increase"
    min_value: 1
    max_value: 5
  task_adherence:
    type: "boolean"
    desirable_direction: "increase"
    min_value: 0
    max_value: 1
  groundedness:
    type: "ordinal"
    desirable_direction: "increase"
    min_value: 1
    max_value: 5
  task_completion:
    type: "boolean"
    desirable_direction: "increase"
    min_value: 0
    max_value: 1
path: ./evaluator
