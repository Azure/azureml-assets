type: "evaluator"
name: "builtin.task_completion"
version: 21
displayName: "Task-Completion-Evaluator-(Preview)"
description: "Evaluates whether an AI agent successfully completed the requested task end to end by analyzing the conversation history and agent response to determine if all task requirements were met, ignoring rule adherence or intent understanding. This evaluator is useful for assessing agent effectiveness in task-oriented scenarios, workflow automation, and goal-oriented AI interactions."
evaluatorType: "builtin"
evaluatorSubType: "code"
categories: ["agents", "business"]
tags:
  is_continuous_scenario: "true"
  provider: "Microsoft"
supportedEvaluationLevels: ["conversation", "turn"]
initParameterSchema:
  type: "object"
  description: "Hosted initialization uses a named deployment resolved by the service."
  properties:
    deployment_name:
      type: "string"
    evaluation_level:
      type: "string"
    probability_threshold:
      type: "number"
      minimum: 0
      maximum: 1
      description: "Decision-only completion probability cutoff, checked after trusted named-deployment resolution. Overrides the resolved configuration cutoff; defaults to 0.75 when neither is supplied. The public binary score threshold remains 1."
  required: ["deployment_name"]
dataMappingSchema:
  type: "object"
  properties:
    query:
      anyOf:
        - type: "string"
        - type: "array"
          items:
            type: "object"
    response:
      anyOf:
        - type: "string"
        - type: "array"
          items:
            type: "object"
    messages:
      type: "array"
      items:
        type: "object"
    tool_definitions:
      anyOf:
        - type: "object"
        - type: "array"
          items:
            type: "object"
  anyOf:
    - required: ["query", "response"]
    - required: ["messages"]
outputSchema:
  task_completion:
    type: "boolean"
    desirable_direction: "increase"
    min_value: 0
    max_value: 1
path: ./evaluator
