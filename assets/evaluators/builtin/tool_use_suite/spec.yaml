type: "evaluator"
id: "azureml://registries/azureml/evaluators/builtin.tool_use_suite/versions/1"
name: "builtin.tool_use_suite"
version: 1
displayName: "Tool-Use-Evaluation-Suite-(Preview)"
description: "A composite evaluator that batches the tool_call_accuracy, tool_call_success, tool_input_accuracy, tool_output_utilization, and tool_selection evaluators into a single LLM call. The primary tool_use_suite score fails when any evaluated evaluator fails, while the evaluator keys preserve the LLM results and derived pass/fail fields. Supports both single-turn (query/response) and multi-turn (messages) agent interactions."
evaluatorType: "builtin"
evaluatorSubType: "code"
categories: ["agents"]
metadata:
  provider: "Microsoft"
  is_continuous_scenario: "true"
  composite_evaluator: ["tool_call_accuracy", "tool_call_success", "tool_input_accuracy", "tool_output_utilization", "tool_selection"]
supportedEvaluationLevels: ["conversation", "turn"]
initParameterSchema:
  type: "object"
  properties:
    deployment_name:
      type: "string"
    threshold:
      type: "number"
      minimum: 0
      maximum: 1
      multipleOf: 1
    evaluation_level:
      type: "string"
  required: ["deployment_name"]
dataMappingSchema:
  type: "object"
  properties:
    query:
      anyOf:
        - type: "string"
        - type: "array"
          items:
            type: "object"
    response:
      anyOf:
        - type: "string"
        - type: "array"
          items:
            type: "object"
    messages:
      type: "array"
      items:
        type: "object"
    tool_definitions:
      anyOf:
        - type: "object"
        - type: "array"
          items:
            type: "object"
  anyOf:
    - required: ["query", "response", "tool_definitions"]
    - required: ["messages", "tool_definitions"]
definition:
  type: "code"
  code_text: null
  blob_uri: "https://.../tool-use-suite/evaluator"
  metrics:
    tool_use_suite:
      type: "boolean"
      desirable_direction: "increase"
      min_value: 0
      max_value: 1
      is_primary: true
    tool_call_accuracy:
      type: "ordinal"
      desirable_direction: "increase"
      min_value: 1
      max_value: 5
    tool_call_success:
      type: "boolean"
      desirable_direction: "increase"
      min_value: 0
      max_value: 1
    tool_input_accuracy:
      type: "boolean"
      desirable_direction: "increase"
      min_value: 0
      max_value: 1
    tool_output_utilization:
      type: "boolean"
      desirable_direction: "increase"
      min_value: 0
      max_value: 1
    tool_selection:
      type: "boolean"
      desirable_direction: "increase"
      min_value: 0
      max_value: 1
path: ./evaluator
