type: "evaluator"
name: "builtin.conversation_quality"
version: 1
displayName: "Conversation-Quality-Evaluators-(Preview)"
description: "A meta-evaluator that batches fluency, coherence, intent_resolution, task_adherence, groundedness, and task_completion into a single LLM call. The primary conversation_quality score fails when any evaluated evaluator fails, while the evaluator keys preserve the raw LLM results. Supports single-turn query/response and multi-turn messages inputs, including response-only fluency evaluation."
evaluatorType: "builtin"
evaluatorSubType: "code"
categories: ["quality", "agents"]
supportedEvaluationLevels: ["conversation", "turn"]
tags:
  provider: "Microsoft"
  is_continuous_scenario: "true"
definition:
  type: "composite"
  init_parameters:
    type: "object"
    properties:
      deployment_name:
        type: "string"
      evaluation_level:
        type: "string"
      threshold:
        type: "number"
        minimum: 1
        maximum: 5
        multipleOf: 1
    required: ["deployment_name"]
  data_schema:
    type: "object"
    properties:
      query:
        anyOf:
          - type: "string"
          - type: "array"
            items:
              type: "object"
      response:
        anyOf:
          - type: "string"
          - type: "array"
            items:
              type: "object"
      tool_definitions:
        anyOf:
          - type: "object"
          - type: "array"
            items:
              type: "object"
      messages:
        type: "array"
        items:
          type: "object"
    anyOf:
      - required: ["query", "response"]
      - required: ["messages"]
  metrics:
    conversation_quality:
      type: "boolean"
      min_value: 0
      max_value: 1
      desirable_direction: "increase"
    evaluator_metrics:
      type: "ordinal"
      min_value: 1
      max_value: 5
      desirable_direction: "increase"
  evaluator_properties:
    builtin.fluency: {}
    builtin.coherence: {}
    builtin.intent_resolution: {}
    builtin.groundedness: {}
    builtin.task_adherence:
      init_parameters:
        properties:
          threshold:
            type: "number"
            minimum: 0
            maximum: 1
            multipleOf: 1
      metrics:
        task_adherence:
          type: "boolean"
          min_value: 0
          max_value: 1
          desirable_direction: "increase"
    builtin.task_completion:
      init_parameters:
        properties:
          threshold:
            type: "number"
            minimum: 0
            maximum: 1
            multipleOf: 1
      metrics:
        task_completion:
          type: "boolean"
          min_value: 0
          max_value: 1
          desirable_direction: "increase"
path: ./evaluator
