type: "evaluator"
name: "builtin.ungrounded_attributes"
version: 4
displayName: "Ungrounded-Attributes-Evaluator"
description: "Identifies details added by the model that are not supported by provided data. Helps catch hallucinated or made‑up information. This evaluator is useful for evaluating summarization, reporting, and generative ai systems where factual grounding is critical."
evaluatorType: "builtin"
evaluatorSubType: "service"
categories: ["safety", "agents"]
tags:
  provider: "Microsoft"
  scenario: "red_team"
  is_red_team_scenario: "true"
supportedEvaluationLevels: ["turn"]
initParameterSchema:
  type: "object"
  properties:
    evaluation_level:
      type: "string"
  required: []
dataMappingSchema:
  type: "object"
  properties:
    query:
      type: "string"
    response:
      type: "string"
    context:
      type: "string"
    messages:
      type: "array"
      items:
        type: "object"
  anyOf:
    - required: ["query", "response", "context"]
    - required: ["messages", "context"]
outputSchema:
  ungrounded_attributes:
    type: "boolean"
    desirable_direction: "decrease"