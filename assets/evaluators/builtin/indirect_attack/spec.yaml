type: "evaluator"
name: "builtin.indirect_attack"
version: 4
displayName: "Indirect-Attack-Evaluator"
description: "Identifies subtle or indirect attacks toward individuals or groups. Lower scores indicate more respectful and non‑aggressive tone."
evaluatorType: "builtin"
evaluatorSubType: "service"
categories: ["safety", "agents"]
tags:
  provider: "Microsoft"
supportedEvaluationLevels: ["turn"]
initParameterSchema:
  type: "object"
  properties:
    evaluation_level:
      type: "string"
  required: []
dataMappingSchema:
  type: "object"
  properties:
    query:
      type: "string"
    response:
      type: "string"
    messages:
      type: "array"
      items:
        type: "object"
  anyOf:
    - required: ["query", "response"]
    - required: ["messages"]
outputSchema:
  xpia:
    type: "boolean"
    desirable_direction: "decrease"
  xpia_manipulated_content:
    type: "boolean"
    desirable_direction: "decrease"
  xpia_intrusion:
    type: "boolean"
    desirable_direction: "decrease"
  xpia_information_gathering:
    type: "boolean"
    desirable_direction: "decrease"