type: "evaluator"
id: "azureml://registries/azureml/evaluators/builtin.tool_use_quality/versions/1"
name: "builtin.tool_use_quality"
version: 7
displayName: "Tool Use Quality Evaluator"
description: "A composite evaluator that batches the tool_call_accuracy, tool_call_success, tool_input_accuracy, tool_output_utilization, and tool_selection evaluators into a single LLM call."
evaluatorType: "builtin"
evaluatorSubType: "code"
categories: ["agents"]
tags:
  provider: "Microsoft"
  recommended: "true"
  is_continuous_scenario: "true"
  composite_evaluator: "tool_call_accuracy, tool_call_success, tool_input_accuracy, tool_output_utilization, tool_selection"
supportedEvaluationLevels: ["conversation", "turn"]
initParameterSchema:
  type: "object"
  description: "Hosted initialization uses a named deployment resolved by the service."
  properties:
    deployment_name:
      type: "string"
    threshold:
      type: "object"
      additionalProperties: false
      description: "Optional per-member public score thresholds; omitted members retain their defaults. Independent of the Decision binary probability cutoff."
      properties:
        tool_call_accuracy:
          type: "number"
          minimum: 1
          maximum: 5
        tool_call_success:
          type: "number"
          minimum: 0
          maximum: 1
        tool_input_accuracy:
          type: "number"
          minimum: 0
          maximum: 1
        tool_output_utilization:
          type: "number"
          minimum: 0
          maximum: 1
        tool_selection:
          type: "number"
          minimum: 0
          maximum: 1
    evaluation_level:
      type: "string"
    probability_threshold:
      type: "number"
      minimum: 0
      maximum: 1
      description: "Decision-only probability cutoff for binary members, checked after trusted named-deployment resolution. Overrides the resolved configuration cutoff; defaults to 0.75."
  required: ["deployment_name"]
dataMappingSchema:
  type: "object"
  properties:
    query:
      anyOf:
        - type: "string"
        - type: "array"
          items:
            type: "object"
    response:
      anyOf:
        - type: "string"
        - type: "array"
          items:
            type: "object"
    messages:
      type: "array"
      minItems: 1
      items:
        type: "object"
    tool_definitions:
      anyOf:
        - type: "object"
        - type: "array"
          items:
            type: "object"
  anyOf:
    - required: ["query", "response"]
    - required: ["messages"]
outputSchema:
  tool_use_quality:
    type: "boolean"
    desirable_direction: "increase"
    min_value: 0
    max_value: 1
    is_primary: true
  tool_call_accuracy:
    type: "ordinal"
    desirable_direction: "increase"
    min_value: 1
    max_value: 5
  tool_call_success:
    type: "boolean"
    desirable_direction: "increase"
    min_value: 0
    max_value: 1
  tool_input_accuracy:
    type: "boolean"
    desirable_direction: "increase"
    min_value: 0
    max_value: 1
  tool_output_utilization:
    type: "boolean"
    desirable_direction: "increase"
    min_value: 0
    max_value: 1
  tool_selection:
    type: "boolean"
    desirable_direction: "increase"
    min_value: 0
    max_value: 1
path: ./evaluator
