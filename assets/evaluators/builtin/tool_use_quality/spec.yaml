type: "evaluator"
name: "builtin.tool_use_quality"
version: 1
displayName: "Tool-Use-Quality-Evaluators-(Preview)"
description: "A meta-evaluator that batches the tool_call_accuracy, tool_call_success, tool_input_accuracy, tool_output_utilization, and tool_selection evaluators into a single LLM call. The primary tool_use_quality score fails when any evaluated evaluator fails, while the evaluator keys preserve the raw LLM results. Supports both single-turn (query/response) and multi-turn (messages) agent interactions."
evaluatorType: "builtin"
evaluatorSubType: "code"
categories: ["agents"]
tags:
  provider: "Microsoft"
  is_continuous_scenario: "true"
supportedEvaluationLevels: ["conversation", "turn"]
definition:
  type: "composite"
  init_parameters:
    type: "object"
    properties:
      deployment_name:
        type: "string"
      evaluation_level:
        type: "string"
      threshold:
        type: "number"
        minimum: 0
        maximum: 1
        multipleOf: 1
    required: ["deployment_name"]
  data_schema:
    type: "object"
    properties:
      query:
        anyOf:
          - type: "string"
          - type: "array"
            items:
              type: "object"
      response:
        anyOf:
          - type: "string"
          - type: "array"
            items:
              type: "object"
      messages:
        type: "array"
        items:
          type: "object"
      tool_definitions:
        anyOf:
          - type: "object"
          - type: "array"
            items:
              type: "object"
    anyOf:
      - required: ["query", "response", "tool_definitions"]
      - required: ["messages", "tool_definitions"]
  metrics:
    tool_use_quality:
      type: "boolean"
      min_value: 0
      max_value: 1
      desirable_direction: "increase"
    evaluator_metrics:
      type: "boolean"
      min_value: 0
      max_value: 1
      desirable_direction: "increase"
  evaluator_properties:
    builtin.tool_call_success: {}
    builtin.tool_input_accuracy: {}
    builtin.tool_call_accuracy:
      init_parameters:
        properties:
          threshold:
            type: "number"
            minimum: 1
            maximum: 5
            multipleOf: 1
      metrics:
        tool_call_accuracy:
          type: "ordinal"
          min_value: 1
          max_value: 5
          desirable_direction: "increase"
    builtin.tool_output_utilization: {}
    builtin.tool_selection: {}
path: ./evaluator
