name: clm-v0.1-8b
path: ./
system_metadata:
  previewType: hideUI
  foundryLocal: ''
  deploymentOptions: ['Foundry Local on Devices']
version: 1
description: |
  CLM-v0.1-8B is a contrastive language model for local candidate ranking. Foundry Local variants are available for CPU, CUDA GPU, and WebGPU with mixed FP16 and INT4 precision.

  # Model Description
  - **Developed by:** Contrastive-LM
  - **Optimized by:** Microsoft
  - **Model type:** ONNX
  - **License:** apache-2.0
  - **Model Description:** This model ranks candidate answers against a question and optional structured context.
  - **Disclaimer:** This model is an optimization of the base model. Validate its ranking behavior for your scenario. Optimizations are distinct from fine-tuning and do not alter the model's intended capabilities.

  # Base Model Information
  See Hugging Face model [CLM-v0.1-8B](https://huggingface.co/Contrastive-LM/CLM-v0.1-8B) for details.
