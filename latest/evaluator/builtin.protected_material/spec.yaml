type: "evaluator"
name: "builtin.protected_material"
version: 4
displayName: "Protected-Material-Evaluator"
description: "Detects use of copyrighted or proprietary content in responses. Ensures
  generated text stays within acceptable use boundaries."
evaluatorType: "builtin"
evaluatorSubType: "service"
categories: ["safety", "agents"]
tags:
  provider: "Microsoft"
initParameterSchema:
  type: "object"
  properties: {}
  required: []
dataMappingSchema:
  type: "object"
  properties:
    query:
      type: "string"
    response:
      type: "string"
    messages:
      type: "array"
      items:
        type: "object"
  anyOf:
  - required: ["query", "response"]
  - required: ["messages"]
outputSchema:
  protected_material:
    type: "boolean"
    desirable_direction: "decrease"
