type: "evaluator"
name: "builtin.task_level_rubric"
version: 2
displayName: "Task-Level-Rubric-Evaluator-(Preview)"
description: "Evaluates an agent's response or full conversation against the task-specific
  rubric supplied for each dataset row. Uses an LLM judge with dedicated last-turn
  and conversation prompts to return overall and per-dimension verdicts with explanations.
  Applicable criteria receive pass/fail verdicts; inapplicable criteria are marked
  as skipped. When a valid expected field is provided, its expected-answer check is
  a hard pass/fail gate: failure fails the overall task regardless of rubric results.
  Requires rubric_dimensions together with either messages or both query and response.
  Optional tool definitions and a test-case description provide additional context."
evaluatorType: "builtin"
evaluatorSubType: "service"
categories: ["agents", "quality"]
tags:
  provider: "Microsoft"
supportedEvaluationLevels: ["turn", "conversation"]
initParameterSchema:
  type: "object"
  properties:
    deployment_name:
      type: "string"
    threshold:
      type: "number"
      minimum: 0
      maximum: 1
      default: 1
      description: "Evaluator-wide threshold used internally; not included in results."
  required: ["deployment_name"]
dataMappingSchema:
  type: "object"
  properties:
    messages:
      type: "array"
      minItems: 1
      description: "Full task trace. Takes precedence over query and response when
        provided."
      items:
        type: "object"
    query:
      anyOf:
      - type: "string"
        pattern: '\S'
      - type: "array"
        minItems: 1
        items:
          type: "object"
    response:
      anyOf:
      - type: "string"
        pattern: '\S'
      - type: "array"
        minItems: 1
        items:
          type: "object"
    rubric_dimensions:
      type: "array"
      minItems: 0
      maxItems: 20
      description: "Structured row rubric. Map from ${data.test_case_rubric}; JSON
        strings are not accepted."
      items:
        type: "object"
        properties:
          id:
            type: "string"
            pattern: '\S'
          description:
            type: "string"
            pattern: '\S'
          weight:
            type: "integer"
            minimum: 1
        required: ["id", "description", "weight"]
        additionalProperties: true
    tool_definitions:
      anyOf:
      - type: "object"
      - type: "array"
        items:
          type: "object"
    test_case_description:
      type: "string"
  required: ["rubric_dimensions"]
  anyOf:
  - required: ["messages"]
  - required: ["query", "response"]
outputSchema:
  task_level_rubric:
    type: "boolean"
    desirable_direction: "increase"
    is_primary: true
