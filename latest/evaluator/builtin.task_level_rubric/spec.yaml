type: "evaluator"
name: "builtin.task_level_rubric"
version: 2
displayName: "Task-Level-Rubric-Evaluator-(Preview)"
description: "Evaluates each Task (one dataset row containing a trace) against that
  row's rubric dimensions. Returns overall and per-dimension pass/fail with explanations.
  Uses a temporary placeholder judge prompt for integration testing, not approved
  production grading."
evaluatorType: "builtin"
evaluatorSubType: "service"
categories: ["agents", "quality"]
tags:
  provider: "Microsoft"
supportedEvaluationLevels: ["conversation"]
initParameterSchema:
  type: "object"
  properties:
    deployment_name:
      type: "string"
    threshold:
      type: "number"
      minimum: 0
      maximum: 1
      default: 1
      description: "Evaluator-wide threshold used internally; not included in results."
  required: ["deployment_name"]
dataMappingSchema:
  type: "object"
  properties:
    query:
      anyOf:
      - type: "string"
        pattern: '\S'
      - type: "array"
        minItems: 1
        items:
          type: "object"
    response:
      anyOf:
      - type: "string"
        pattern: '\S'
      - type: "array"
        minItems: 1
        items:
          type: "object"
    rubric_dimensions:
      type: "array"
      minItems: 1
      maxItems: 20
      description: "Structured row rubric. Map from ${data.test_case_rubric}; JSON
        strings are not accepted."
      items:
        type: "object"
        properties:
          id:
            type: "string"
            pattern: '\S'
          description:
            type: "string"
            pattern: '\S'
          weight:
            type: "integer"
            minimum: 1
        required: ["id", "description", "weight"]
        additionalProperties: true
    tool_definitions:
      anyOf:
      - type: "object"
      - type: "array"
        items:
          type: "object"
    test_case_description:
      type: "string"
  required: ["rubric_dimensions", "query", "response"]
  not:
    required: ["messages"]
outputSchema:
  task_level_rubric:
    type: "boolean"
    desirable_direction: "increase"
    is_primary: true
