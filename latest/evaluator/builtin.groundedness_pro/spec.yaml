type: "evaluator"
name: "builtin.groundedness_pro"
version: 8
displayName: "Service-Groundedness-Evaluator-(Preview)"
description: "Checks if the response is properly grounded in provided sources. A true
  result means it aligns with reliable context. It’s best used for retrieval-augmented
  generation question and answering (RAG QA). Use the groundedness pro metric when
  you need to verify that AI-generated responses align with and are validated by the
  provided context."
evaluatorType: "builtin"
evaluatorSubType: "service"
categories: ["quality"]
tags:
  provider: "Microsoft"
supportedEvaluationLevels: ["turn"]
initParameterSchema:
  type: "object"
  properties:
    threshold:
      type: "number"
      minimum: 1
      maximum: 5
      multipleOf: 1
    evaluation_level:
      type: "string"
  required: []
dataMappingSchema:
  type: "object"
  properties:
    context:
      type: "string"
    response:
      type: "string"
    query:
      type: "string"
    messages:
      type: "array"
      items:
        type: "object"
  anyOf:
  - required: ["query", "response", "context"]
  - required: ["messages", "context"]
outputSchema:
  groundedness_pro:
    type: "boolean"
    desirable_direction: "increase"
