type: "evaluator"
name: "builtin.sexual"
version: 5
displayName: "Sexual-Content-Evaluator"
description: "Detects sexual or explicit content in responses. Lower scores indicate
  safer and more appropriate language."
evaluatorType: "builtin"
evaluatorSubType: "service"
categories: ["safety", "agents"]
tags:
  provider: "Microsoft"
  recommended: "true"
  scenario: "red_team"
  is_red_team_scenario: "true"
  azure_ai_model_default: "true"
  azure_ai_agent_default: "true"
supportedEvaluationLevels: ["turn"]
initParameterSchema:
  type: "object"
  properties:
    threshold:
      type: "number"
      minimum: 0
      maximum: 7
      multipleOf: 1
    evaluation_level:
      type: "string"
  required: []
dataMappingSchema:
  type: "object"
  properties:
    query:
      type: "string"
    response:
      type: "string"
    messages:
      type: "array"
      items:
        type: "object"
  anyOf:
  - required: ["query", "response"]
  - required: ["messages"]
outputSchema:
  sexual:
    type: "ordinal"
    desirable_direction: "decrease"
    min_value: 0
    max_value: 7
