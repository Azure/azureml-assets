type: "evaluator"
name: "builtin.tool_output_utilization"
version: 14
displayName: "Tool-Output-Utilization-Evaluator"
description: "Checks if an agent correctly interprets and contextually uses the outputs
  returned by invoked tools (e.g., APIs, DB queries, search results) without fabrication
  or omission. Use it to validate that agents accurately reuse and represent tool
  outputs in their responses across tool-dependent systems."
evaluatorType: "builtin"
evaluatorSubType: "code"
categories: ["agents"]
tags:
  provider: "Microsoft"
  is_continuous_scenario: "true"
supportedEvaluationLevels: ["turn"]
initParameterSchema:
  type: "object"
  properties:
    deployment_name:
      type: "string"
    evaluation_level:
      type: "string"
    probability_threshold:
      type: "number"
      minimum: 0
      maximum: 1
      description: "Decision-only score probability cutoff. Overrides the resolved
        configuration cutoff; defaults to 0.75 when neither is supplied. Applicability
        uses a separate fixed cutoff of 0.5."
  required: ["deployment_name"]
dataMappingSchema:
  type: "object"
  properties:
    query:
      anyOf:
      - type: "string"
      - type: "array"
        items:
          type: "object"
    response:
      anyOf:
      - type: "string"
      - type: "array"
        items:
          type: "object"
    tool_definitions:
      anyOf:
      - type: "object"
      - type: "array"
        items:
          type: "object"
    messages:
      type: "array"
      items:
        type: "object"
  anyOf:
  - required: ["query", "response"]
  - required: ["messages"]
outputSchema:
  tool_output_utilization:
    type: "ordinal"
    desirable_direction: "increase"
    min_value: 0
    max_value: 1
path: ./evaluator
