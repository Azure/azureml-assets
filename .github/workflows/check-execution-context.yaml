name: Check execution context

on:
  workflow_call:
    outputs:
      continue:
        description: Whether further jobs should continue
        value: ${{ jobs.check-execution-context.outputs.continue }}
      forked_pr:
        description: Whether the event is operating from a forked PR
        value: ${{ jobs.check-execution-context.outputs.forked_pr }}

defaults:
  run:
    shell: bash

jobs:
  check-execution-context:
    name: Check execution context
    runs-on: ubuntu-latest

    permissions:
      # Required to clone repo
      contents: read

    steps:
      # Some callers rely on job success rather than the continue output.
      - name: Reject fork pull requests
        if: github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Fork pull requests cannot run these workflows. Submit a pull request from a branch in this repository."
          exit 1

      - name: Check event type
        run: echo "continue=${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}" >> "$GITHUB_ENV"

      - name: Set forked PR flag
        if: fromJSON(env.continue)
        run: echo "forked_pr=false" >> "$GITHUB_ENV"

    outputs:
      continue: ${{ env.continue }}
      forked_pr: ${{ env.forked_pr }}
