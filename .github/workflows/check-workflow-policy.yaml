name: Check workflow policy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out trusted base
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: '3.12'

      - name: Install trusted dependencies
        run: python -m pip install -r scripts/validation/requirements.txt

      # Fetch objects only: checking out or running PR code would cross the trust boundary.
      - name: Fetch candidate commit as data
        run: git fetch --no-tags --depth=1 --no-recurse-submodules origin "$PR_HEAD_SHA"

      - name: Validate all candidate workflows
        run: python scripts/validation/workflow_policy.py --repo . --ref "$PR_HEAD_SHA"
